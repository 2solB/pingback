<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="슬랙 같은 메신저에서 가상의 동료들과 대화하며 IT 실무 영어를 연습해요.">
<title>Pingback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: workspace rail + channel sidebar + conversation + mission panel, messenger-style */
:root{
  --rail:#0E2724; --side:#163B36; --side-fg:#C9DDD8; --side-muted:#8DB0A8; --side-active:#2E6E62; --side-hover:#1E4A44;
  --bg:#FAFBF9; --fg:#1B2422; --muted:#66736F; --line:#E2E7E4; --hover:#F1F4F2; --panel:#F4F7F5;
  --accent:#1D7A69; --accent-soft:#E1F1ED; --badge:#E2603F;
  --mention-bg:#FFF1CF; --mention-fg:#7A5200;
  --card:#FFFFFF; --shadow:0 6px 24px rgba(16,40,36,.12);
  --font-ui:"Figtree","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-ko:"IBM Plex Sans KR","Figtree",system-ui,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --rail:#081614; --side:#0F221F; --side-fg:#C2D6D1; --side-muted:#7E9C95; --side-active:#23584E; --side-hover:#173230;
  --bg:#151B1A; --fg:#E4EBE9; --muted:#95A39F; --line:#29332F; --hover:#1C2422; --panel:#111716;
  --accent:#5BC4AE; --accent-soft:#1C3531; --badge:#EE7555;
  --mention-bg:#3A3015; --mention-fg:#F3C767; --card:#1C2422; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --rail:#081614; --side:#0F221F; --side-fg:#C2D6D1; --side-muted:#7E9C95; --side-active:#23584E; --side-hover:#173230;
  --bg:#151B1A; --fg:#E4EBE9; --muted:#95A39F; --line:#29332F; --hover:#1C2422; --panel:#111716;
  --accent:#5BC4AE; --accent-soft:#1C3531; --badge:#EE7555;
  --mention-bg:#3A3015; --mention-fg:#F3C767; --card:#1C2422; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:64px 250px minmax(0,1fr) 300px;height:100%}

/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:14px}
.ws-logo{width:38px;height:38px;border-radius:10px;background:#F2B544;color:#1B2422;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 0 0 2px var(--rail),0 0 0 4px #F2B54466}
.rail-btn{width:56px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--side-muted);font-size:11px;font-family:var(--font-ko)}
.rail-btn .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.rail-btn.on .ic{background:var(--side-active);color:#fff}
.rail-btn.on{color:#fff}
.rail svg{width:18px;height:18px}

/* sidebar */
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;min-width:0}
.side-head{padding:16px 16px 12px;border-bottom:1px solid #ffffff14}
.ws-name{font-weight:800;font-size:17px;color:#fff;display:flex;align-items:center;gap:6px}
.ws-sub{font-size:12px;color:var(--side-muted);margin-top:2px;font-family:var(--font-ko)}
.side-scroll{overflow:auto;padding:10px 8px 20px;flex:1}
.sec-label{font-size:12px;letter-spacing:.04em;color:var(--side-muted);padding:14px 10px 6px;font-weight:600;font-family:var(--font-ko)}
.nav-item{width:100%;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:7px;text-align:left;color:var(--side-fg);font-size:15px}
.nav-item:hover{background:var(--side-hover)}
.nav-item.on{background:var(--side-active);color:#fff}
.nav-item.unread{color:#fff;font-weight:700}
.nav-item .hash{width:18px;text-align:center;opacity:.75}
.nav-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--badge);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.mini-av{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;position:relative}
.mini-av::after{content:"";position:absolute;right:-3px;bottom:-3px;width:8px;height:8px;border-radius:50%;background:#3CC48A;border:2px solid var(--side)}
.side-foot{padding:12px 14px;border-top:1px solid #ffffff14;display:flex;align-items:center;gap:10px;font-size:13px}
.side-foot .me{width:30px;height:30px;border-radius:8px;background:#F2B544;color:#1B2422;display:grid;place-items:center;font-weight:800}
.side-foot b{color:#fff;display:block}
.side-foot span{color:var(--side-muted);font-family:var(--font-ko);font-size:12px}

/* main */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg);height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:0 18px;height:56px;border-bottom:1px solid var(--line);flex-shrink:0}
.topbar h1{font-size:18px;font-weight:800;margin:0;display:flex;align-items:center;gap:6px;min-width:0}
.topbar h1 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic{color:var(--muted);font-size:13px;font-family:var(--font-ko);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tb-btn{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-family:var(--font-ko);color:var(--fg);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tb-btn:hover{background:var(--hover)}
.tb-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.only-narrow{display:none}
.msgs{flex:1;overflow:auto;padding:12px 0 8px}
.intro{padding:22px 22px 10px}
.intro h2{margin:0 0 6px;font-size:22px;font-weight:800}
.intro p{margin:0;color:var(--muted);font-family:var(--font-ko);font-size:14px}
.day{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:0 22px;color:var(--muted);font-size:12px;font-weight:600}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day span{border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-family:var(--font-ko)}

.msg{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:7px 22px}
.msg:hover,.msg.active{background:var(--hover)}
.msg.cont{padding-top:1px}
.msg.cont .av{visibility:hidden;height:0}
.av{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who b{font-weight:800}
.who .role{font-size:12px;color:var(--muted);font-family:var(--font-ko)}
.who time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.text{line-height:1.5;word-wrap:break-word;white-space:pre-wrap;transition:filter .2s}
.text.veiled{filter:blur(6px);user-select:none;cursor:pointer}
.mention{background:var(--mention-bg);color:var(--mention-fg);border-radius:4px;padding:0 3px;font-weight:600}
.me-mention{background:var(--mention-bg)}
.msg.mentions-me{box-shadow:inset 3px 0 0 #E7A92B}
.ko{margin-top:6px;font-family:var(--font-ko);font-size:14px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 10px;line-height:1.55}
.ko .kx{display:block;margin-top:4px;font-size:13px}
.ko .kx em{font-style:normal;color:var(--accent);font-weight:600}
.reacts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:1px 8px;font-size:13px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.react.mine{border-color:var(--accent);background:var(--accent-soft)}
.attach{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:360px;overflow:hidden}
.attach .prev{height:150px;background:linear-gradient(135deg,#EAF3F0,#F8EEDF);position:relative;padding:14px;display:flex;gap:10px}
.phone{flex:1;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:10px 8px;display:flex;flex-direction:column;gap:5px}
.phone i{display:block;height:6px;border-radius:3px;background:#DDE6E3}
.phone i.h{height:10px;width:70%;background:#1D7A69}
.phone i.b{margin-top:auto;height:14px;background:#F2B544;border-radius:5px}
.attach .meta{padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted)}
.attach .meta b{color:var(--fg);font-weight:600}

.tools{position:absolute;top:-14px;right:22px;display:none;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:3px;gap:2px;z-index:3}
.msg:hover .tools,.msg.active .tools,.msg:focus-within .tools{display:flex}
.tools button{font-size:12px;font-family:var(--font-ko);padding:5px 9px;border-radius:6px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.tools button:hover{background:var(--hover)}
.tools button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.tools svg{width:14px;height:14px}

.typing{height:22px;padding:0 22px;font-size:12px;color:var(--muted);font-family:var(--font-ko);display:flex;align-items:center;gap:6px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bop 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-2px)}}

/* composer */
.composer-wrap{padding:0 18px 16px;position:relative;flex-shrink:0}
.composer{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.composer:focus-within{border-color:var(--accent)}
.fmt{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
.fmt span{padding:2px 7px;border-radius:5px;font-weight:700}
.composer textarea{width:100%;border:0;resize:none;background:transparent;color:var(--fg);font:inherit;padding:10px 14px;min-height:44px;max-height:160px;outline:none;display:block;box-sizing:border-box}
.comp-bar{display:flex;align-items:center;gap:6px;padding:6px 8px}
.help-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-family:var(--font-ko);font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:8px}
.help-btn:hover{filter:brightness(.97)}
.send{margin-left:auto;width:34px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:#fff}
.send:disabled{background:var(--hover);color:var(--muted);cursor:default}
.send svg{width:16px;height:16px}
.hint{font-size:12px;color:var(--muted);font-family:var(--font-ko);padding:6px 4px 0}

.pop{position:absolute;left:18px;right:18px;bottom:calc(100% - 8px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;z-index:5;font-family:var(--font-ko);max-width:560px}
.pop h3{margin:0 0 8px;font-size:14px}
.pop-row{display:flex;gap:8px}
.pop input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;background:var(--bg);color:var(--fg)}
.pop .go{background:var(--accent);color:#fff;border-radius:8px;padding:0 14px;font-weight:600;font-size:13px;white-space:nowrap}
.sugs{display:grid;gap:8px;margin-top:10px}
.sug{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.sug .tone{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.sug .en{font-family:var(--font-ui);line-height:1.45}
.sug button{justify-self:start;font-size:12px;font-weight:600;color:var(--accent)}
.pop .note{font-size:12px;color:var(--muted);margin:10px 0 0}

/* mission panel */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 28px;font-family:var(--font-ko);display:flex;flex-direction:column;gap:22px}
.p-eyebrow{font-size:11px;letter-spacing:.08em;font-weight:700;color:var(--accent);text-transform:uppercase;font-family:var(--font-ui)}
.brief h2{margin:4px 0 6px;font-size:18px;line-height:1.35;text-wrap:balance}
.brief p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.brief .where{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:7px}
.checks{display:grid;gap:4px;margin:8px 0 0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:9px;font-size:14px;line-height:1.4}
.checks li.cur{background:var(--card);box-shadow:0 1px 0 var(--line)}
.checks li.done{color:var(--muted)}
.checks li.done .lbl{text-decoration:line-through}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff;margin-top:-1px}
.done .ck{background:var(--accent);border-color:var(--accent)}
.cur .ck{border-color:var(--accent)}
.h-sec{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.h-sec span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.vocab{display:grid;gap:8px;margin-top:8px}
.voc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.voc b{font-family:var(--font-ui);font-size:15px;display:block}
.voc span{font-size:13px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);line-height:1.6;border:1px dashed var(--line);border-radius:10px;padding:12px}
.review{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:14px}
.review h3{margin:2px 0 8px;font-size:16px}
.review ol{margin:0;padding-left:18px;display:grid;gap:6px;font-family:var(--font-ui);font-size:14px;line-height:1.45}
.review p{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.55}
.restart{margin-top:10px;font-size:13px;font-weight:600;color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-family:var(--font-ko);box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px)}
.scrim{display:none}


.chat-view{display:flex;flex-direction:column;flex:1;min-height:0}
.nav-item .cnt{font-size:12px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.react{cursor:pointer;color:var(--fg)}
.react:hover{border-color:var(--muted)}
.react.add{color:var(--muted);padding:1px 7px}
.react.add svg{width:15px;height:15px}
.react.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.picker{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;gap:2px}
.picker button{font-size:20px;width:36px;height:36px;border-radius:8px}
.picker button:hover{background:var(--hover);transform:scale(1.12)}
.kw{border-bottom:1.5px dashed var(--accent);cursor:pointer;position:relative}
.kw:hover{background:var(--accent-soft)}
.kw .kt{display:none;position:absolute;left:0;bottom:calc(100% + 8px);background:var(--fg);color:var(--bg);font-family:var(--font-ko);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;z-index:6;width:max-content;max-width:240px;white-space:normal;font-weight:500;box-shadow:var(--shadow)}
.kw .kt b{display:block;font-family:var(--font-ui);font-size:13px}
.kw .kt small{display:block;opacity:.7;margin-top:3px}
.kw:hover .kt{display:block}
.text.veiled .kw .kt{display:none}
.tip{position:absolute;left:18px;bottom:calc(100% - 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px 12px;z-index:5;max-width:min(620px,calc(100% - 36px));font-family:var(--font-ko)}
.tip::after{content:"";position:absolute;left:28px;bottom:-6px;width:10px;height:10px;background:var(--card);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.tip-head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px}
.tip-head button{font-size:12px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:5px 10px;text-align:left;display:grid;gap:1px}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip b{font-family:var(--font-ui);font-weight:600;font-size:13px}
.chip span{font-size:11px;color:var(--muted)}
.vocab-view{flex:1;overflow:auto;padding:22px 22px 40px;font-family:var(--font-ko)}
.vv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:980px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.vcard .en{font-family:var(--font-ui);font-size:18px;font-weight:700}
.vcard .mean{font-size:14px;line-height:1.5;transition:filter .2s}
.vcard .mean.veiled{filter:blur(6px);cursor:pointer;user-select:none}
.vcard .ex{font-family:var(--font-ui);font-size:13px;color:var(--muted);line-height:1.5;border-left:2px solid var(--line);padding-left:8px}
.vcard .src{font-size:12px;color:var(--muted)}
.vcard .acts{display:flex;gap:12px;margin-top:4px}
.vcard .acts button{font-size:12px;font-weight:600;color:var(--accent)}
.vcard .acts button.del{color:var(--muted)}
.vv-empty{max-width:460px;border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);line-height:1.7;font-size:14px}
.vv-empty button{margin-top:10px;font-weight:600;color:var(--accent)}
.voc{cursor:pointer}

.help-btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.only-short{display:none}
.react.rin{animation:rin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes rin{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.react .n{display:inline-block;min-width:.6em;text-align:center}
.react .n.bump{animation:tickup .32s ease-out}
@keyframes tickup{0%{transform:translateY(80%);opacity:0}100%{transform:none;opacity:1}}
.ab{border-bottom:1.5px dotted var(--muted);cursor:help;position:relative;font-weight:600}
.ab:hover{background:var(--hover)}
.ab .kt{display:none;position:absolute;left:0;bottom:calc(100% + 8px);background:var(--fg);color:var(--bg);font-family:var(--font-ko);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;z-index:6;width:max-content;max-width:240px;white-space:normal;font-weight:500;box-shadow:var(--shadow)}
.ab .kt b{display:block;font-family:var(--font-ui);font-size:13px}
.ab .kt small{display:block;opacity:.7;margin-top:3px}
.ab:hover .kt{display:block}
.text.veiled .ab .kt{display:none}
.coach{margin-top:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;max-width:560px;font-family:var(--font-ko)}
.coach .ch-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent);flex-wrap:wrap}
.coach .verdict{font-weight:600;border-radius:20px;padding:1px 8px;background:var(--accent-soft);color:var(--accent)}

.coach.loading{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.coach.mini{padding:6px 10px}
.quiz{max-width:600px}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q-head b{font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-size:12px;padding:4px 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.q-ko{font-size:13px;color:var(--muted);margin:8px 0 10px;line-height:1.55}
.q-sent{font-family:var(--font-ui);font-size:16px;line-height:2.1}
.slot{display:inline-block;min-width:74px;border-bottom:2px solid var(--accent);padding:0 6px;margin:0 2px;text-align:center;font-weight:600;color:var(--accent);border-radius:4px 4px 0 0;line-height:1.5}
.slot.empty{color:transparent;background:var(--accent-soft)}
.slot.next{box-shadow:0 0 0 2px var(--accent)}
.slot.ok{color:#fff;background:var(--accent);border-color:var(--accent)}
.slot.no{color:var(--badge);border-color:var(--badge);background:color-mix(in srgb,var(--badge) 12%,transparent);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.bank button{font-family:var(--font-ui);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 12px}
.bank button:hover{border-color:var(--accent)}
.bank button:disabled{opacity:.3;cursor:default}
.q-acts{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.q-acts button{font-size:13px;font-weight:600;border-radius:8px;padding:7px 12px}
.q-acts .pri{background:var(--accent);color:#fff}
.q-acts .pri:disabled{background:var(--hover);color:var(--muted);cursor:default}
.q-acts .sec{color:var(--accent)}
.q-acts .x{margin-left:auto;color:var(--muted);font-weight:500}
.q-msg{font-size:13px;margin:8px 0 0;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;max-width:980px}
.dict .d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.dict .d b{font-family:var(--font-ui);font-size:16px}
.dict .d .full{font-family:var(--font-ui);font-size:13px;color:var(--accent);font-weight:600}
.dict .d span{font-size:13px;color:var(--muted);line-height:1.5}
.dict .d .seen{font-size:11px;font-weight:700;color:var(--mention-fg);background:var(--mention-bg);border-radius:10px;padding:1px 7px;justify-self:start}
.kw.flip .kt,.ab.flip .kt{left:auto;right:0}
.used{font-size:11px;color:var(--muted);grid-column:2;margin-top:-4px}
.stat{font-size:13px;margin-top:8px;color:var(--fg)}

@media (max-width:1100px){

  .panel{position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);z-index:12;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}

}

   sugs:[{tone:"CASUAL",en:"Hi everyone! I'm Solbi, the new product designer. Super excited to be here 😊"},

          {s:"Thanks for the [warm] welcome, Maya! I'm Solbi, and I'll be [working] on product design. Looking [forward] to working with you all.",ko:"따뜻하게 맞아줘서 고마워요, Maya! 솔비고, 프로덕트 디자인을 맡게 됐어요. 다 같이 일하는 거 기대돼요.",d:["hot","work","ahead"]}],

const ABBR={

  "ICYMI":["In Case You Missed It","혹시 못 보셨을까 봐"]
};
const ABBR_RE=new RegExp("(?<![\\w+])("+Object.keys(ABBR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\w])","g");
const EMOJI=["👍","🙌","🎉","❤️","😂","🙏","👀","✅"];

const S = {view:"chat",vtab:"mine",cur:"general",stage:0,unread:{},mention:{},vocab:[],veilAll:false,quiz:false,mine:[],clock:9*60+2,busy:false,noted:false,tipOff:false,help:{},seenAbbr:new Set()};
let uid=0, SAMPLE=null, aiOff=false;
const IN_CLAUDE=!!window.claude?.use;
if(IN_CLAUDE) claude.use("sample").then(s=>{SAMPLE=s}).catch(()=>{});
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtT=m=>{const h=Math.floor(m/60),mm=String(m%60).padStart(2,"0");return `${h>12?h-12:h}:${mm} ${h>=12?"PM":"AM"}`};
const tick=n=>{S.clock+=n;return fmtT(S.clock)};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const chOf=id=>{for(const k in CH){if(CH[k].msgs.some(x=>x.id===id)) return k}};
const findMsg=id=>{for(const k in CH){const m=CH[k].msgs.find(x=>x.id===id); if(m) return m}};
const chLabel=k=>CH[k].kind==="ch"?`#${CH[k].name}`:`${P[CH[k].who].name} DM`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function add(ch,m,{silent}={}){
  m.id=++uid; m.time=m.time||fmtT(S.clock); m.reacts=m.reacts||[];
  CH[ch].msgs.push(m);
  if(m.from!=="me") for(const x of m.text.matchAll(ABBR_RE)) S.seenAbbr.add(x[1]);
  if(!(ch===S.cur&&S.view==="chat") && !silent){
    S.unread[ch]=(S.unread[ch]||0)+1;
    if(m.text.includes("@Solbi")||CH[ch].kind==="dm") S.mention[ch]=true;
  }
  if(m.late) m.late.forEach(([e,d])=>lateReact(m,e,d));
  if(ch===S.cur) renderMsgs(true);
  renderNav();
  return m;
}
function lateReact(m,e,delay){
  setTimeout(()=>{
    const r=m.reacts.find(x=>x.e===e);
    if(r){r.n++; r.bump=true} else m.reacts.push({e,n:1,fresh:true});
    if(chOf(m.id)===S.cur&&S.view==="chat") renderMsgs(false);
  },delay);
}

    `<div class="sec-label">채널</div>${chs.map(item).join("")}<div class="sec-label">다이렉트 메시지</div>${dms.map(item).join("")}`;

const isSaved=vid=>S.vocab.some(v=>v.vid===vid);
function keyParts(m){return m.key?m.key.en.split(" / ").map(x=>x.replace(/\s*~\s*$/,"").trim()):[]}
function fmtText(m){
  const t=m.text, R=[];
  const put=(s,e,type,d)=>{if(!R.some(r=>s<r.e&&e>r.s)) R.push({s,e,type,d})};
  for(const x of t.matchAll(/@(Solbi|Maya|Jake|Priya|Tom)\b/g)) put(x.index,x.index+x[0].length,"men");
  if(m.from!=="me") keyParts(m).forEach(k=>{const i=t.toLowerCase().indexOf(k.toLowerCase()); if(i>=0) put(i,i+k.length,"kw")});
  if(m.from!=="me") for(const x of t.matchAll(ABBR_RE)) put(x.index,x.index+x[0].length,"ab",x[1]);
  R.sort((a,b)=>a.s-b.s);
  let out="",p=0;
  for(const r of R){
    out+=esc(t.slice(p,r.s)); const seg=esc(t.slice(r.s,r.e));
    if(r.type==="men") out+=`<span class="mention">${seg}</span>`;
    else if(r.type==="kw") out+=`<span class="kw" data-act="kw">${seg}<span class="kt"><b>${esc(m.key.en)}</b>${esc(m.key.ko)}<small>${isSaved("m"+m.id)?"단어장에 저장됨":"눌러서 단어장에 저장"}</small></span></span>`;
    else {const [full,ko]=ABBR[r.d]; out+=`<span class="ab" data-act="ab" data-ab="${esc(r.d)}">${seg}<span class="kt"><b>${esc(r.d)} · ${esc(full)}</b>${esc(ko)}<small>${isSaved("a"+r.d)?"단어장에 저장됨":"업무 약어 · 눌러서 저장"}</small></span></span>`}
    p=r.e;
  }
  return out+esc(t.slice(p));
}
function coachHTML(m){
  const c=m.coach; if(!c||c.hidden) return "";
  if(c.state==="loading") return `<div class="coach loading"><span class="dots"><i></i><i></i><i></i></span>원어민이라면 어떻게 쓸지 찾고 있어요</div>`;
  if(c.state==="error") return `<div class="coach mini"><span class="why">원어민 제안을 불러오지 못했어요. <button class="c-retry" data-act="coach-retry" style="color:var(--accent);font-weight:600">다시 시도</button></span></div>`;
  const fix=c.verdict!=="natural";
  return `<div class="coach">
    <div class="ch-top">원어민이라면 <span class="verdict${fix?" fix":""}">${c.example?"예시 표현":fix?"이렇게 다듬어보세요":"충분히 자연스러워요"}</span></div>
    <div class="nat">${esc(c.natural)}</div>
    ${c.why?`<div class="why">${esc(c.why)}</div>`:""}
    <div class="c-acts">${c.phrase?`<button data-act="coach-save">${isSaved("c"+m.id)?"저장됨":`“${esc(c.phrase.en)}” 저장`}</button>`:""}<button class="mute" data-act="coach-hide">접기</button></div>
  </div>`;
}
function renderMsgs(scroll){
  if(S.view!=="chat") return;
  const c=CH[S.cur], box=$("msgs");
  const title=c.kind==="ch"?`#${c.name}`:P[c.who].name;
  const sub=c.kind==="ch"?`${c.topic} 채널이에요.`:`${P[c.who].name}님과의 대화가 여기서 시작돼요. ${P[c.who].role}예요.`;
  let html=`<div class="intro"><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>`;
  let prev=null;
  c.msgs.forEach(m=>{
    if(m.day) html+=`<div class="day"><span>${m.day}</span></div>`;
    const p=P[m.from], cont=prev&&prev.from===m.from&&!m.day&&!m.attach;
    const saved=isSaved("m"+m.id);
    const mine=m.from==="me";
    const veiled=(S.veilAll||m.veil)&&!m.peek&&!mine;
    html+=`<div class="msg${cont?" cont":""}${m.text.includes("@Solbi")?" mentions-me":""}" data-id="${m.id}">
      <div class="av" style="background:${p.c}">${p.i}</div>
      <div style="min-width:0">
        ${cont?"":`<div class="who"><b>${esc(p.name)}</b><span class="role">${esc(p.role)}${mine?" · 나":""}</span><time>${m.time}</time></div>`}
        <div class="text${veiled?" veiled":""}" data-act="peek" title="${veiled?"눌러서 잠깐 보기":""}">${fmtText(m)}</div>
        ${m.attach?`<div class="attach"><div class="prev"><div class="phone"><i class="h"></i><i></i><i style="width:80%"></i><i class="b"></i></div><div class="phone"><i class="h" style="width:50%"></i><i></i><i></i><i style="width:60%"></i><i class="b"></i></div><div class="phone"><i class="h" style="width:60%"></i><i style="width:70%"></i><i></i><i class="b"></i></div></div><div class="meta"><b>onboarding_v2.fig</b><span>Figma · 3 frames</span></div></div>`:""}
        ${m.showKo&&m.ko?`<div class="ko">${esc(m.ko)}${m.key?`<span class="kx"><em>${esc(m.key.en)}</em> · ${esc(m.key.ko)}</span>`:""}</div>`:""}
        ${m.reacts.length?`<div class="reacts">${m.reacts.map(r=>`<button class="react${r.mine?" mine":""}${r.fresh?" rin":""}" data-act="react" data-e="${r.e}" aria-pressed="${!!r.mine}">${r.e} <span class="n${r.bump?" bump":""}">${r.n}</span></button>`).join("")}<button class="react add" data-act="picker" aria-label="반응 추가">${ICON.smile}</button></div>`:""}
        ${mine?coachHTML(m):""}
      </div>
      <div class="tools">
        <button data-act="picker">${ICON.smile}반응</button>
        ${mine?(m.coach&&m.coach.hidden?`<button data-act="coach-show">원어민 제안</button>`:""):`<button data-act="tr" aria-pressed="${!!m.showKo}">${ICON.tr}번역</button>
        <button data-act="veil" aria-pressed="${!!m.veil}">${ICON.veil}가리기</button>
        ${m.key?`<button data-act="save" aria-pressed="${saved}">${ICON.save}${saved?"저장됨":"저장"}</button>`:""}`}
      </div>
    </div>`;
    prev=m;
  });
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=html;
  c.msgs.forEach(m=>m.reacts.forEach(r=>{r.fresh=false;r.bump=false}));
  if(scroll||atBottom) box.scrollTop=box.scrollHeight;
}
function toggleReact(m,e){
  const r=m.reacts.find(x=>x.e===e);
  if(r&&r.mine){r.mine=false;r.n--; if(!r.n) m.reacts.splice(m.reacts.indexOf(r),1)}
  else if(r){r.mine=true;r.n++;r.bump=true}
  else m.reacts.push({e,n:1,mine:true,fresh:true});
}
function saveItem(item){
  const i=S.vocab.findIndex(v=>v.vid===item.vid);
  if(i>=0){S.vocab.splice(i,1); toast("단어장에서 뺐어요")}
  else {S.vocab.unshift(item); toast(`단어장에 저장했어요: ${item.en}`)}
  renderPanel(); renderNav();
}
const saveKey=m=>m.key&&saveItem({vid:"m"+m.id,msg:m.id,en:m.key.en,ko:m.key.ko,from:m.from,ch:chOf(m.id),ex:m.text});
$("msgs").addEventListener("click",e=>{
  const row=e.target.closest(".msg"); if(!row) return;
  const m=findMsg(+row.dataset.id); const el=e.target.closest("[data-act]"); const act=el?.dataset.act;
  if(!act){document.querySelectorAll(".msg.active").forEach(x=>x!==row&&x.classList.remove("active")); row.classList.toggle("active"); return}
  const veiled=(S.veilAll||m.veil)&&!m.peek&&m.from!=="me";
  if(act==="picker"){showPicker(el,m); return}
  if(act==="react") toggleReact(m,el.dataset.e);
  else if(act==="tr") m.showKo=!m.showKo;
  else if(act==="veil"){m.veil=!m.veil; m.peek=false}
  else if((act==="kw"||act==="ab")&&veiled) m.peek=true;
  else if(act==="kw") saveKey(m);
  else if(act==="ab"){const k=el.dataset.ab; saveItem({vid:"a"+k,msg:m.id,en:k,ko:`${ABBR[k][0]} · ${ABBR[k][1]}`,from:m.from,ch:chOf(m.id),ex:m.text})}
  else if(act==="peek"){ if(!veiled&&!m.peek) {row.classList.toggle("active");return} m.peek=!m.peek }
  else if(act==="save") saveKey(m);
  else if(act==="coach-hide") m.coach.hidden=true;
  else if(act==="coach-show") m.coach.hidden=false;
  else if(act==="coach-retry") coach(m);
  else if(act==="coach-save"){const c=m.coach; saveItem({vid:"c"+m.id,msg:m.id,en:c.phrase.en,ko:c.phrase.ko,from:"me",ch:chOf(m.id),ex:c.natural})}
  renderMsgs(false);
  const again=document.querySelector(`.msg[data-id="${m.id}"]`); if(again&&act!=="peek"&&act!=="react") again.classList.add("active");
});
$("veilAll").addEventListener("click",e=>{
  S.veilAll=!S.veilAll; e.currentTarget.setAttribute("aria-pressed",S.veilAll);
  for(const k in CH) CH[k].msgs.forEach(m=>m.peek=false);
  renderMsgs(false);
});

/* native-speaker coach */
function recentContext(ch,upto){
  const list=CH[ch].msgs, i=list.indexOf(upto);
  return list.slice(Math.max(0,i-5),i).map(x=>`${x.from==="me"?"Solbi (learner)":P[x.from].name+" ("+P[x.from].role+")"}: ${x.text}`).join("\n");
}
async function coach(m){
  const ch=chOf(m.id), mi=MISSIONS.findIndex(x=>x.ch===ch);
  const fallback=()=>{
    const ms=MISSIONS[mi];
    if(ms){const sug=ms.sugs[1]; m.coach={state:"done",example:true,verdict:"tweak",natural:sug.en,why:"AI 제안을 쓸 수 없어서, 이 상황의 예시 표현을 보여드려요.",phrase:{en:ms.phrases[0][0],ko:ms.phrases[0][1]}}}
    else m.coach=null;
  };
  if(aiOff||(IN_CLAUDE&&!SAMPLE)){fallback(); rerender(ch); return}
  m.coach={state:"loading"}; rerender(ch);
  const prompt=`You are a friendly English writing coach for a Korean product designer who is practicing workplace English in a Slack-style roleplay at a US tech startup.
Situation (in Korean): ${mi>=0?MISSIONS[mi].brief:"자유 대화"}
Channel: ${chLabel(ch)}
Recent messages:
${recentContext(ch,m)||"(none)"}

The learner (Solbi) just sent: "${m.text}"

Rewrite the learner's message the way a native English-speaking coworker would naturally write it in Slack, keeping the same meaning, intent and roughly the same length. If it is in Korean or mixed, write it fully in English. If it is already natural, keep it nearly unchanged.
Reply with only JSON like:
{"verdict":"natural"|"tweak"|"rewrite","natural":"<the rewritten message>","why_ko":"<one or two short sentences in Korean: what changed and why, or what was good>","phrase":{"en":"<one short reusable expression from your version>","ko":"<its Korean meaning>"}}`;
  try{
    const r=await askAI(prompt);
    if(!r||typeof r.natural!=="string") throw {code:"invalid_json"};
    m.coach={state:"done",verdict:r.verdict||"tweak",natural:r.natural,why:String(r.why_ko||""),phrase:r.phrase&&r.phrase.en?{en:String(r.phrase.en),ko:String(r.phrase.ko||"")}:null};
  }catch(e){
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e&&e.code)){aiOff=true; fallback()}
    else m.coach={state:"error"};
  }
  rerender(ch);
}
async function askAI(prompt){
  if(IN_CLAUDE) return SAMPLE.json(prompt,{modelTier:"quick"});
  let r;
  try{ r=await fetch("/api/coach",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt})}) }
  catch(e){ throw {code:"upstream_error"} }
  if(r.status===404||r.status===503) throw {code:"not_granted"};
  if(!r.ok) throw {code:"upstream_error"};
  return r.json();
}
function rerender(ch){ if(ch===S.cur&&S.view==="chat") renderMsgs(false) }

function send(viaQuiz){

/* recommendation tooltip */
let tipItems=[];
function renderTip(){
  const tip=$("tip");
  const show=S.view==="chat"&&(S.focus||document.activeElement===input)&&!S.tipOff&&$("pop").hidden&&$("quiz").hidden;
  if(!show){tip.hidden=true;return}
  const t=input.value;
  let title, items=[];
  for(const sw of SWAPS){const mm=t.match(sw.re); if(mm){title=`“${mm[0]}” 대신 이렇게도 써보세요`; items=sw.alts.map(([en,ko])=>({en,ko,match:mm})); break}}
  if(!items.length){
    const m=MISSIONS[S.stage];
    const list=m&&m.ch===S.cur?m.phrases:GENERIC;
    title=m&&m.ch===S.cur?"이 상황에서 자주 쓰는 표현":"업무 채팅에서 자주 쓰는 표현";
    items=list.map(([en,ko])=>({en,ko}));
  }
  tipItems=items;
  $("tipTitle").textContent=title;
  $("chips").innerHTML=items.map((x,i)=>`<button class="chip" data-i="${i}"><b>${esc(x.en)}</b><span>${esc(x.ko)}</span></button>`).join("");
  tip.hidden=false;
}
$("chips").addEventListener("mousedown",e=>e.preventDefault());
$("chips").addEventListener("click",e=>{
  const b=e.target.closest("[data-i]"); if(!b) return;
  const it=tipItems[+b.dataset.i], hasSlot=it.en.includes("~");
  const phrase=it.en.replace(/\s*~\s*/g," ").trim();
  if(it.match){
    const i=it.match.index;
    input.value=input.value.slice(0,i)+phrase+input.value.slice(i+it.match[0].length);
    const c=i+phrase.length; input.setSelectionRange(c,c);
  } else {
    const pos=input.selectionStart??input.value.length, before=input.value.slice(0,pos), after=input.value.slice(pos);
    const sep=before&&!/\s$/.test(before)?" ":"";
    const ins=sep+phrase+(hasSlot?" ":"");
    input.value=before+ins+after; const c=pos+ins.length; input.setSelectionRange(c,c);
  }
  input.focus(); autosize(); renderTip();
});
$("tipClose").addEventListener("mousedown",e=>e.preventDefault());
$("tipClose").addEventListener("click",()=>{S.tipOff=true;renderTip()});

/* help: fill-in-the-blank quiz */
let Q=null;
const quizEl=$("quiz"), quizBtn=$("quizBtn2");
function openQuiz(variant){
  closePop();
  const mi=S.stage, ms=MISSIONS[mi];
  if(!ms||ms.ch!==S.cur){
    Q=null;
    quizEl.innerHTML=`<div class="q-head"><b>도움 요청</b></div><p class="q-ko">${ms?`지금 미션은 <b>${esc(ms.title)}</b>예요. ${esc(chLabel(ms.ch))}에서 도움을 요청해보세요.`:"오늘 미션을 모두 끝냈어요. 자유롭게 대화해보세요."}</p><div class="q-acts">${ms?`<button class="pri" data-q="goto">${esc(chLabel(ms.ch))}로 이동</button>`:""}<button class="x" data-q="close">닫기</button></div>`;
  } else {
    const cz=ms.cloze[variant], parts=cz.s.split(/\[(.+?)\]/);
    const slots=[]; parts.forEach((p,i)=>{if(i%2) slots.push({ans:p,val:null})});
    Q={mi,variant,parts,ko:cz.ko,slots,bank:shuffle([...slots.map(s=>s.ans),...cz.d]).map(w=>({w,used:false})),checked:false,solved:false};
  }
  quizEl.hidden=false; quizBtn.setAttribute("aria-expanded","true"); $("tip").hidden=true;
  if(Q) renderQuiz();
}
function renderQuiz(){
  const next=Q.slots.findIndex(s=>s.val===null);
  let si=0;
  const sent=Q.parts.map((p,i)=>{
    if(!(i%2)) return esc(p);
    const k=si++, s=Q.slots[k];
    const st=s.val===null?"empty"+(k===next?" next":""):Q.checked?(s.ok?"ok":"no"):"";
    return `<button class="slot ${st}" data-slot="${k}" aria-label="빈칸 ${k+1}">${s.val?esc(s.val):"＿＿"}</button>`;
  }).join("");
  const full=Q.slots.every(s=>s.val!==null);
  quizEl.innerHTML=`
    <div class="q-head"><b>빈칸을 채워 답장을 완성해보세요</b>
      <div class="seg"><button data-qv="0" aria-pressed="${Q.variant===0}">캐주얼</button><button data-qv="1" aria-pressed="${Q.variant===1}">정중하게</button></div></div>
    <p class="q-ko">${esc(Q.ko)}</p>
    <div class="q-sent">${sent}</div>
    ${Q.solved?"":`<div class="bank">${Q.bank.map((b,i)=>`<button data-b="${i}" ${b.used?"disabled":""}>${esc(b.w)}</button>`).join("")}</div>`}
    <div class="q-acts">
      ${Q.solved?`<button class="pri" data-q="send">바로 보내기</button><button class="sec" data-q="insert">입력창에 넣고 고치기</button>`
        :`<button class="pri" data-q="check" ${full?"":"disabled"}>정답 확인</button>`}
      <button class="x" data-q="close">닫기</button>
    </div>
    <p class="q-msg">${Q.solved?"완벽해요! 이대로 보내거나, 입력창에 넣고 내 말투로 고쳐보세요.":Q.checked?"빨간 칸을 눌러 비우고 다시 골라보세요.":"아래 단어를 눌러 빈칸을 순서대로 채워요. 채운 칸을 누르면 다시 비워져요."}</p>`;
}
function quizSentence(){let si=0;return Q.parts.map((p,i)=>i%2?Q.slots[si++].ans:p).join("")}
quizEl.addEventListener("click",e=>{
  const q=e.target.closest("[data-q]")?.dataset.q;
  if(q==="close"){closeQuiz();return}
  if(q==="goto"){const ms=MISSIONS[S.stage]; go(ms.ch); openQuiz(0); return}
  if(!Q) return;
  const v=e.target.closest("[data-qv]"); if(v){openQuiz(+v.dataset.qv);return}
  const b=e.target.closest("[data-b]");
  if(b){const it=Q.bank[+b.dataset.b], s=Q.slots.find(x=>x.val===null); if(s&&!it.used){s.val=it.w;s.bi=+b.dataset.b;it.used=true;Q.checked=false}}
  const sl=e.target.closest("[data-slot]");
  if(sl&&!Q.solved){const s=Q.slots[+sl.dataset.slot]; if(s.val!==null){Q.bank[s.bi].used=false;s.val=null;Q.checked=false}}
  if(q==="check"){Q.checked=true;Q.slots.forEach(s=>s.ok=s.val===s.ans);Q.solved=Q.slots.every(s=>s.ok)}
  if(q==="send"){input.value=quizSentence();autosize();send(true);return}
  if(q==="insert"){const ms=MISSIONS[S.stage]; if(ms) S.help[S.stage]=true; input.value=quizSentence();autosize();closeQuiz();input.focus();return}
  renderQuiz();
});
function closeQuiz(){quizEl.hidden=true;quizBtn.setAttribute("aria-expanded","false")}
quizBtn.addEventListener("click",()=>{ if(!quizEl.hidden){closeQuiz();return} openQuiz(0) });
